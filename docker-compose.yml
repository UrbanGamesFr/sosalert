# SOSAlert - production sur un VPS unique
# api : serveur web + API | worker : envois, échéances de trajet, rétention | db : PostgreSQL | caddy : HTTPS automatique
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sosalert
      POSTGRES_USER: sosalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosalert -d sosalert"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    image: sosalert:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sosalert:${POSTGRES_PASSWORD}@db:5432/sosalert
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: sosalert:latest
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sosalert:${POSTGRES_PASSWORD}@db:5432/sosalert
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  dbdata:
  caddy_data:
  caddy_config:
